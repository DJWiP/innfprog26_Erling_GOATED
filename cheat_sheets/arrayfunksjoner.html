<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheat Sheet for Array funkskjoner</title>
</head>
<body>
    <h1>Array Funksjoner</h1>
    <p>Vi finner antall i en array ved å bruke .length: <span id="arraycount"></span></p>
    <h2>To måter og skrive ut en Array på:</h2>
    <p>.toString(): <span id="toString"></span></p>
    <p>join(): <span id="join"></span></p>

    <h2>Array etter slettemetoder er kjørt</h2>
    <p id="deleted"></p>

    <h2>Sortering</h2>
    <p>Sortert A-Å: <span id="sortAZ"></span></p>
    <p>Sortert Å-A: <span id="sortZA"></span></p>

    <h2>Sortering av Tall</h2>
    <p>Sorter 0-9: <span id="sort09"></span></p>
    <p>Sorter 9-0: <span id="sort90"></span></p>

    <script>
        const books = [
            "Silver Eyes",
            "Harry Potter of de vises sten",
            "Fourth Wing",
            "Bibelen",
            "Nålen",
            "Jævla Drittsystem",
            "Dont't make me think",
            "Twisted Ones",
            "Hunger Games",
            "Surrounded by idiots"
        ]
        //.length gjør en full count av alle indexene i en array
        document.getElementById("arraycount").innerHTML = books.length 

        //Legge til elemtner i arrayen:
        //.push(elements): Legger inn element på slutten av arrayen
        books.push("LOTR: Fellowship of the ring")
        //.unshift(element): LEgger inn element i starten av arrayen, og forskyver indexer!
        books.unshift("LOTR: Two towers")
        //.splice(startindex, number of elements modified, element(s)):
        //startindex: hvilken index vi starter å manipulere arrayen på
        //number of elements modified: Hvis vi skal slette elementer, hvor mange fra og med startindex (eksempel startindex er 2, og antall elementer som sletter er 2, så slettes index 2 og 3). Når vi legger til elementer, skal number of elements modified alltid være 0
        books.splice(5, 0, "LOTR: Return of the King")

        //:tostring(): skriver ut en kommaseparert liste av array
        document.getElementById("toString").innerHTML = books.toString()
        //.join(param): join skriver ut alle elementene i en array, separert av param
        document.getElementById("join").innerHTML = books.join(", ")
        
        //fjerne elementer i arrayen:
        //.pop(): Sletter det siste i elementet i arrayen
        books.pop()
        //.shift(): sletter det første elemntet i arrayen:
        books.shift()
        //.splice(startindex, number of elements to delete)
        //books.splice(4, 1)

        //.indexOf(element): finner det første elementet i arrayen som matcher parameteren param, og returnerer indexen
        const indexFound = books.indexOf("LOTR: Return of the Kings")
        console.log("index til LOTR-bok: ", indexFound)
        //Bruke indexOf-verdien i variabelen indexFound
        books.splice(indexFound, 1)
        //hvis elementet vi forsøker å finne indexen til ikke finnes, returnerer indexenOf = -1

        //Hvordan sjekke om en verdi finnes i en array: 
        const bookExists = books.includes("Fourth Wing")
        console.log("Finnes Fourth Wing? ", bookExists)
        
        document.getElementById("deleted").innerHTML = books.join(", ")

        //sortere en array fra A til Å
        books.sort()
        document.getElementById("sortAZ").innerHTML = books.join(", ")
        //sortere en array fra Å til A
        books.reverse()
        document.getElementById("sortZA").innerHTML = books.join(", ")

        //sortere enn array med tall:
        const tall = [99, 6, 34, 8, 9, 8, 111, 44, 83, 29, 6000, 15, 69, 366, 42]
        tall.sort(function(a, b) {return a - b})
        document.getElementById("sort09").innerHTML = tall.join(", ")
        tall.sort(function(a, b) {return b - a})
        document.getElementById("sort90").innerHTML = tall.join(", ")
    </script>
</body>
</html>
