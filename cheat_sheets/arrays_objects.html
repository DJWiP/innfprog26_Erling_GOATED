<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheat Sheet for Arrays and Object</title>
</head>
<body>
    <h1>Array for bok med 1 forfatter</h1>
    <ul>
        <li>Tittel: <span id="book1_title"></span></li>
        <li>Forfatter(e): <span id="book1_author"></span></li>
        <li>Antall sider: <span id="book1_page_count"></span></li>
    </ul>

    <h1>Array for bok med flere forfattere</h1>
    <ul>
        <li>Tittel: <span id="book2_title"></span></li>
        <li>Forfatter(e): <span id="book2_author"></span></li>
        <li>Antall sider: <span id="book2_page_count"></span></li>
    </ul>

    <h1>Object for bok</h1>
    <ul>
        <li>Tittel: <span id="book3_title"></span></li>
        <li>Forfatter(e): <span id="book3_author"></span></li>
        <li>Antall sider: <span id="book3_page_count"></span></li>
    </ul>

    <script>
        //Array med bok med en forfatter
        const book1 = [
            "Fourth wing",
            "Rebecka Yaris",
            512
        ]

        //Array med bok med flere forfattere
        const book2 = [
            "Silver Eyes",
            "Scott Cawthon",
            "Keira Wrisley",
            365
        ]

        //Object med bok
        const book3 = {
            title: "Harry Potter og de vises stein",
            author: "JK Rowling",
            pagecount: 333 
        }

        //Print Info fra book1 til HTML:
        document.getElementById("book1_title").innerHTML = book1[0]
        document.getElementById("book1_author").innerHTML = book1[1]
        document.getElementById("book1_page_count").innerHTML = book1[2]

        //Print info fra book2 til HTML:
        document.getElementById("book2_title").innerHTML = book2[0]
        document.getElementById("book2_author").innerHTML = book2[1]  +", " + book2[2]
        document.getElementById("book2_page_count").innerHTML = book2[3]

        //Print info fra book3 til HTML:
        //Book3 er et object, vi må derfor refere til nokler i stedet for indexer.
        document.getElementById("book3_title").innerHTML = book3.title
        document.getElementById("book3_author").innerHTML = book3.author
        document.getElementById("book3_page_count").innerHTML = book3.pagecount

    </script>
</body>
</html>
